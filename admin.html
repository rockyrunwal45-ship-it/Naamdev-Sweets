<!DOCTYPE html><html>
<head>
  <title>Admin Panel</title>  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>  <style>
    body { font-family: Arial; padding:20px; background:#f5f5f5; }
    .card { border:1px solid #ddd; padding:10px; margin:10px; border-radius:8px; background:#fff; }
    button { margin:5px; padding:5px 10px; }
  </style></head><body><h2>🔐 Admin Login</h2><div id="loginBox">
  <input id="id" placeholder="ID"><br><br>
  <input id="pass" placeholder="Password" type="password"><br><br>
  <button onclick="login()">Login</button>
</div><div id="panel" style="display:none;">
  <h2>📦 Orders</h2>
  <div id="orders"></div>
</div><script>
const firebaseConfig = {
  apiKey: "AIzaSyBMpFfXUhIIRHHNTk8GasBxdPDUwWcP3KI",
  authDomain: "naamdev-sweets.firebaseapp.com",
  projectId: "naamdev-sweets",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function login(){
  if(id.value=="894926" && pass.value=="Rakesh"){
    loginBox.style.display="none";
    panel.style.display="block";
    loadOrders();
  } else {
    alert("Wrong login");
  }
}

function loadOrders(){

  db.collection("orders").orderBy("time","desc")
  .onSnapshot(snapshot => {

    let html="";

    snapshot.forEach(doc=>{
      let o = doc.data();

      html += `
      <div class="card">
        <b>${o.name}</b><br>
        📞 ${o.phone}<br>
        📍 ${o.address}<br>
        💰 ₹${o.total}<br>
        🧾 ${o.paymentId || "N/A"}<br>
        📦 Status: ${o.status}<br><br>

        ${o.cart.map(i=>"- "+i.name+" ₹"+i.price).join("<br>")}

        <br><br>
        <button onclick="update('${doc.id}','Accepted')">Accept</button>
        <button onclick="update('${doc.id}','Rejected')">Reject</button>
        <button onclick="update('${doc.id}','Delivered')">Delivered</button>
      </div>`;
    });

    orders.innerHTML = html;
  });
}

function update(id,status){
  db.collection("orders").doc(id).update({status:status});
}
</script></body>
</html>
