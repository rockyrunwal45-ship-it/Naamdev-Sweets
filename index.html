<!DOCTYPE html><html>
<head>
  <title>Naamdev Sweets</title>  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>  <style>
    body { font-family: Arial; margin:0; background:#f4f4f4; }
    header { background:#ff6600; color:#fff; padding:15px; text-align:center; }

    .container { padding:10px; }

    .item {
      background:#fff;
      padding:10px;
      margin-bottom:10px;
      border-radius:10px;
    }

    button {
      background:#ff6600;
      color:#fff;
      border:none;
      padding:6px 10px;
      border-radius:5px;
    }

    input {
      width:100%;
      padding:8px;
      margin-top:5px;
    }
  </style></head><body><header>🍬 Naamdev Sweets</header><div class="container"><div id="menu"></div><h3>🛒 Cart</h3>
<div id="cart"></div>
<h3>Total ₹<span id="total">0</span></h3><h3>📍 Address</h3>
<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<input id="pincode" placeholder="Pincode (341517 only)">
<input id="distance" placeholder="Distance (KM)"><button onclick="payNow()">Pay Now</button>

</div><script>
// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyBMpFfXUhIIRHHNTk8GasBxdPDUwWcP3KI",
  authDomain: "naamdev-sweets.firebaseapp.com",
  projectId: "naamdev-sweets",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Products
let products = [
  {name:"Milk Cake", price:350},
  {name:"Laddu", price:160},
  {name:"Samosa", price:20}
];

let cart = [];
let total = 0;

// Render
let html="";
products.forEach((p,i)=>{
  html += `<div class="item">
    ${p.name} ₹${p.price}
    <button onclick="add(${i})">Add</button>
  </div>`;
});
menu.innerHTML = html;

function add(i){
  cart.push(products[i]);
  total += products[i].price;
  update();
}

function update(){
  let h="";
  cart.forEach(i=>{
    h += i.name + "<br>";
  });
  cart.innerHTML = h;
  total.innerText = total;
}

// PAYMENT
function payNow(){

  let nm = name.value;
  let ph = phone.value;
  let pin = pincode.value;
  let dist = distance.value;

  if(!nm || !ph || !pin || !dist){
    alert("Fill all details"); return;
  }

  // 📍 LOCATION CHECK
  if(pin != "341517"){
    alert("Only Ladriya 341517 allowed"); return;
  }

  if(parseFloat(dist) > 2){
    alert("Delivery only within 2KM"); return;
  }

  if(total == 0){
    alert("Cart empty"); return;
  }

  let options = {
    key: "rzp_test_T9dipl8p8O50UO",
    amount: total*100,
    currency: "INR",

    handler: async function(res){

      try{

        // 🧾 ORDER ID
        let orderId = "NS" + Date.now();

        // 🔥 SAVE TO FIREBASE (FIXED)
        await db.collection("orders").add({
          orderId: orderId,
          name: nm,
          phone: ph,
          pincode: pin,
          distance: dist,
          cart: cart,
          total: total,
          paymentId: res.razorpay_payment_id,
          status: "Paid",
          time: new Date().toLocaleString()
        });

        // ✅ SUCCESS PAGE
        document.body.innerHTML = `
          <h2>✅ Order Success</h2>
          <p>Order ID: ${orderId}</p>
          <p>Track this ID in shop</p>
        `;

      }catch(e){
        alert("Error saving order");
        console.log(e);
      }

    }
  };

  new Razorpay(options).open();
}
</script></body>
</html>
