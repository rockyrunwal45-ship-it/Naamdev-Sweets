<!DOCTYPE html><html>
<head>
  <title>Naamdev Sweets</title>  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>  <style>
    body { font-family: Arial; padding:20px; }
    .item { border:1px solid #ccc; padding:10px; margin:10px; }
    button { padding:6px 10px; }
  </style></head><body><h2>🍬 NAAMDEV SWEETS</h2><div id="menu"></div><h3>🛒 Cart</h3>
<div id="cart"></div>
<h3>Total: ₹<span id="total">0</span></h3><h3>📋 Details</h3>
<input id="name" placeholder="Name"><br><br>
<input id="phone" placeholder="Phone"><br><br>
<input id="address" placeholder="Address"><br><br><button onclick="payNow()">Pay Now</button>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBMpFfXUhIIRHHNTk8GasBxdPDUwWcP3KI",
  authDomain: "naamdev-sweets.firebaseapp.com",
  projectId: "naamdev-sweets",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let products = [
  {name:"Milk Cake", price:350},
  {name:"Kalakand", price:350},
  {name:"Mawa Chakki", price:250},
  {name:"Doodh Peda", price:250},
  {name:"Barfi", price:250},
  {name:"Rasgulla", price:180},
  {name:"Laddu", price:160},
  {name:"Gulab Jamun", price:140},
  {name:"Samosa", price:20},
  {name:"Kachori", price:25},
  {name:"Mirchi Bada", price:25}
];

let cart = [];
let total = 0;

let menuHTML = "";
products.forEach((p,i)=>{
  menuHTML += `<div class="item">
    ${p.name} - ₹${p.price}
    <button onclick="addToCart(${i})">Add</button>
  </div>`;
});
document.getElementById("menu").innerHTML = menuHTML;

function addToCart(i){
  cart.push(products[i]);
  total += products[i].price;
  updateCart();
}

function updateCart(){
  let html="";
  cart.forEach(i=>{
    html += i.name + " ₹" + i.price + "<br>";
  });
  document.getElementById("cart").innerHTML = html;
  document.getElementById("total").innerText = total;
}

function payNow(){

  let options = {
    key: "rzp_test_T9dipl8p8O50UO",
    amount: total * 100,
    currency: "INR",
    name: "Naamdev Sweets",

    handler: async function (response){

      let order = {
        name: name.value,
        phone: phone.value,
        address: address.value,
        cart: cart,
        total: total,
        paymentId: response.razorpay_payment_id,
        status: "Pending",
        time: new Date().toLocaleString()
      };

      await db.collection("orders").add(order);

      alert("✅ Order Placed!");
    }
  };

  new Razorpay(options).open();
}
</script></body>
</html>
