<!DOCTYPE html><html>
<head>
  <title>Naamdev Sweets</title>  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>  <style>
    body {
      font-family: Arial;
      margin:0;
      background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    }

    header {
      background:#ff6600;
      color:#fff;
      padding:15px;
      text-align:center;
      font-size:22px;
      font-weight:bold;
    }

    .container { padding:15px; }

    .grid {
      display:grid;
      grid-template-columns: repeat(auto-fit,minmax(150px,1fr));
      gap:10px;
    }

    .item {
      background:#fff;
      border-radius:10px;
      padding:10px;
      text-align:center;
      box-shadow:0 2px 6px rgba(0,0,0,0.2);
    }

    .btn {
      background:#ff6600;
      color:#fff;
      border:none;
      padding:6px 10px;
      border-radius:5px;
      cursor:pointer;
    }

    .cart-box {
      background:#fff;
      margin-top:15px;
      padding:10px;
      border-radius:10px;
      box-shadow:0 2px 6px rgba(0,0,0,0.2);
    }

    input {
      width:100%;
      padding:8px;
      margin-top:8px;
      border-radius:5px;
      border:1px solid #ccc;
    }

    .pay-btn {
      width:100%;
      margin-top:10px;
      background:#28a745;
      padding:10px;
      font-size:16px;
    }
  </style></head><body><header>🍬 NAAMDEV SWEETS</header><div class="container"><div class="grid" id="menu"></div><div class="cart-box">
  <h3>🛒 Cart</h3>
  <div id="cartItems"></div>
  <h3>Total: ₹<span id="totalPrice">0</span></h3>
</div><div class="cart-box">
  <h3>📋 Details</h3>
  <input id="custName" placeholder="Name">
  <input id="custPhone" placeholder="Phone">
  <input id="custAddress" placeholder="Address"><button class="btn pay-btn" onclick="payNow()">Pay Now</button>

</div></div><script>
// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyBMpFfXUhIIRHHNTk8GasBxdPDUwWcP3KI",
  authDomain: "naamdev-sweets.firebaseapp.com",
  projectId: "naamdev-sweets",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Products
let products = [
  {name:"Milk Cake", price:350},
  {name:"Kalakand", price:350},
  {name:"Mawa Chakki", price:250},
  {name:"Doodh Peda", price:250},
  {name:"Barfi", price:250},
  {name:"Rasgulla", price:180},
  {name:"Laddu", price:160},
  {name:"Gulab Jamun", price:140},
  {name:"Samosa", price:20},
  {name:"Kachori", price:25},
  {name:"Mirchi Bada", price:25}
];

let cart = [];
let total = 0;

// Render menu
let menuHTML="";
products.forEach((p,i)=>{
  menuHTML += `
  <div class="item">
    <h4>${p.name}</h4>
    <p>₹${p.price}</p>
    <button class="btn" onclick="addToCart(${i})">Add</button>
  </div>`;
});
document.getElementById("menu").innerHTML = menuHTML;

// Add to cart FIXED
function addToCart(i){
  cart.push(products[i]);
  total += products[i].price;
  updateCart();
}

// Update cart FIXED
function updateCart(){
  let h="";
  cart.forEach(item=>{
    h += item.name + " - ₹" + item.price + "<br>";
  });

  document.getElementById("cartItems").innerHTML = h;
  document.getElementById("totalPrice").innerText = total;
}

// Payment
function payNow(){

  if(total==0){ alert("Cart empty"); return; }

  let name = document.getElementById("custName").value;
  let phone = document.getElementById("custPhone").value;
  let address = document.getElementById("custAddress").value;

  if(!name || !phone || !address){
    alert("Fill all details"); return;
  }

  let options = {
    key: "rzp_test_T9dipl8p8O50UO",
    amount: total * 100,
    currency: "INR",
    name: "Naamdev Sweets 🎂",

    handler: async function (res){

      await db.collection("orders").add({
        name, phone, address,
        cart, total,
        paymentId: res.razorpay_payment_id,
        status:"Paid",
        time:new Date().toLocaleString()
      });

      alert("✅ Order Done!");
      cart=[]; total=0;
      updateCart();
    }
  };

  new Razorpay(options).open();
}
</script></body>
</html>
