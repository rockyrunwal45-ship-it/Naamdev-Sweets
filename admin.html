<!DOCTYPE html><html>
<head>
  <title>Admin Panel</title>  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>  <style>
    body { margin:0; font-family:Arial; background:#f4f4f4; }

    header {
      background:#ff6600;
      color:#fff;
      padding:15px;
      text-align:center;
      font-size:20px;
    }

    .login-box {
      max-width:300px;
      margin:80px auto;
      background:#fff;
      padding:20px;
      border-radius:10px;
    }

    input { width:100%; padding:10px; margin-top:10px; }

    button {
      padding:8px;
      margin-top:5px;
      border:none;
      cursor:pointer;
      border-radius:5px;
    }

    .panel { display:none; padding:10px; }

    .order {
      background:#fff;
      padding:10px;
      margin-bottom:10px;
      border-radius:10px;
    }

    .accept { background:#28a745; color:#fff; }
    .reject { background:#dc3545; color:#fff; }
    .delete { background:#000; color:#fff; }

    .top-bar {
      background:#fff;
      padding:10px;
      margin-bottom:10px;
      border-radius:10px;
    }
  </style></head><body><header>🔥 ADMIN PANEL</header><div class="login-box" id="loginBox">
  <input id="user" placeholder="ID">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div><div class="panel" id="panel">  <div class="top-bar">
    💰 Today Sales: ₹<span id="sales">0</span>
  </div>  <div id="orders"></div>
</div><audio id="sound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<script>
// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyBMpFfXUhIIRHHNTk8GasBxdPDUwWcP3KI",
  authDomain: "naamdev-sweets.firebaseapp.com",
  projectId: "naamdev-sweets",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let firstLoad = true;

// LOGIN
function login(){
  if(user.value=="894926" && pass.value=="Rakesh"){
    loginBox.style.display="none";
    panel.style.display="block";
    loadOrders();
  } else alert("Wrong login");
}

// LOAD ORDERS
function loadOrders(){

  db.collection("orders").onSnapshot(snapshot=>{

    let html="";
    let totalSales=0;

    snapshot.forEach(doc=>{
      let o = doc.data();

      // Daily sales calc
      let today = new Date().toLocaleDateString();
      if(o.time && o.time.includes(today)){
        totalSales += o.total || 0;
      }

      let items="";
      if(o.cart){
        o.cart.forEach(i=>{
          items += i.name + " x" + i.qty + "<br>";
        });
      }

      html += `
      <div class="order">
        <b>${o.name || "No Name"}</b><br>
        ${o.phone || ""}<br>
        ${o.address || ""}<br><br>

        <b>Items:</b><br>${items}<br>
        <b>Total:</b> ₹${o.total}<br>
        <b>Status:</b> ${o.status}<br><br>

        <button class="accept" onclick="updateStatus('${doc.id}','Accepted')">Accept</button>
        <button class="reject" onclick="updateStatus('${doc.id}','Rejected')">Reject</button>
        <button class="delete" onclick="deleteOrder('${doc.id}')">Delete</button>
        <button onclick="printBill('${doc.id}', \`${items}\`, '${o.total}')">Print</button>
      </div>`;
    });

    orders.innerHTML = html;
    sales.innerText = totalSales;

    // 🔔 Sound on new order
    if(!firstLoad){
      document.getElementById("sound").play();
    }
    firstLoad = false;

  });
}

// UPDATE STATUS
function updateStatus(id,status){
  db.collection("orders").doc(id).update({status});
}

// DELETE ORDER
function deleteOrder(id){
  if(confirm("Delete this order?")){
    db.collection("orders").doc(id).delete();
  }
}

// PRINT BILL
function printBill(id,items,total){

  let win = window.open('', '', 'width=300,height=600');

  win.document.write(`
    <h3>Naamdev Sweets</h3>
    <hr>
    ${items}
    <hr>
    Total: ₹${total}
    <br><br>Thank You!
  `);

  win.print();
}
</script></body>
</html>
