        // --- GENERAL UI ENGINE RENDER DISPATCHER ---
        function render() {
            const root = document.getElementById("app-root");

            `;
            
            root.innerHTML = viewHtml;
            bindEvents();
            syncLiveOverlay();

        // --- CUSTOMER STOREFRONT VIEW ---
        function renderCustomerStorefront() {
            const activeCartCount = Object.values(state.cart).reduce((a, b) => a + b, 0);

            return `

                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

                            <input type="tel" id="cust-phone" value="\${state.customerPhone}" class="p-2.5 text-sm border border-slate-300 rounded focus:ring-2 focus:ring-orange-500 outline-none w-full" placeholder="Enter 10-Digit Mobile Number">

                    </div>

                    <div class="flex gap-2 border-b border-slate-200 pb-1 overflow-x-auto">
                        \${["Sweets", "Packaged", "Hot Food"].map(cat => \`

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">

                            return \`

                                    <div>
                                        <h4 class="font-bold text-slate-800 text-base">\${product.name}</h4>
                                        <p class="text-sm font-extrabold text-orange-600 mt-0.5">Rs. \${product.price.toFixed(2)}</p>
                                    </div>
                                    \${qty > 0 ? \`
                                        <div class="flex items-center gap-3 bg-orange-50 border border-orange-200 rounded-lg p-1">
                                            <button class="cart-qty-btn w-8 h-8 rounded-md bg-orange-600 text-white font-black flex items-center justify-center shadow-sm" data-id="\${product.id}" data-delta="-1">-</button>

                                        </button>

                            <div class="flex justify-between items-center gap-4">
                                <div>
                                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">\${activeCartCount} items selected</p>
                                    <p class="text-lg font-black text-slate-800">Total: Rs. \${totalSum.toFixed(2)}</p>
                                </div>
                                <button id="pay-token-btn" class="bg-orange-600 hover:bg-orange-700 text-white font-black text-xs uppercase tracking-widest py-3 px-6 rounded-xl transition shadow-md flex-1 text-center">
                                    Pay & Get Token
                                </button>
                            </div>
                        </div>
                    \` : ''}
                </div>
                <div id="modal-target-overlay"></div>
            `;
        }
        // --- UI PARTIAL: ADMIN LOGIN ---

        // --- UI PARTIAL: ADMIN DASHBOARD ---
        function renderAdminDashboard() {
            return `
                <div class="space-y-6">
                    <div class="bg-slate-900 text-white p-4 rounded-xl flex flex-col sm:flex-row justify-between items-center gap-3 shadow-inner">
                        <div>
                            <p class="font-bold text-sm">Live Order Audio Terminal Streamer Status</p>
                            <p class="text-xs text-slate-400">Continuous sound fires automatically when a new customer order is captured.</p>
                        </div>
                        <button id="toggle-audio-alert-btn" class="px-4 py-2 rounded text-xs font-black tracking-wider uppercase transition \${state.audioEnabled ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white animate-pulse'}">
                            \${state.audioEnabled ? "🔊 System Active" : "🔇 Enable Shop Sound Alert"}
                        </button>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 space-y-4">
                            <h3 class="text-lg font-black tracking-tight uppercase text-slate-800 flex items-center gap-2">
                                <span>Live Requests / Orders</span>
                                <span class="bg-orange-600 text-white text-xs px-2 py-0.5 rounded-full">\${state.adminOrders.length} Orders</span>
                            </h3>
                            
                            \${state.adminOrders.length === 0 ? \`
                                <div class="bg-white p-8 rounded-xl text-center border border-dashed border-slate-300 text-slate-400 text-sm font-medium">
                                    No pending orders. Perfect state sync!
                                </div>
                            \` : state.adminOrders.map(order => \`
                                <div class="bg-white border-2 \${order.paymentStatus === 'PENDING' ? 'border-amber-500' : 'border-emerald-500'} rounded-xl p-4 shadow-sm flex flex-col justify-between gap-4 relative overflow-hidden">
                                    <div class="absolute top-0 right-0 \${order.paymentStatus === 'PENDING' ? 'bg-amber-500' : 'bg-emerald-500'} text-white font-black text-xs px-3 py-1 rounded-bl uppercase tracking-wider">
                                        \${order.paymentStatus === 'PENDING' ? 'Wait Payment' : \`TOKEN #\${order.tokenNumber}\`}
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-slate-800 text-base">\${order.customerName}</h4>
                                        <p class="text-xs text-slate-500 font-mono mb-2">Phone: \${order.customerPhone}</p>
                                        <ul class="bg-slate-50 rounded-lg p-2.5 space-y-1.5 border border-slate-100">
                                            \${order.items.map(item => \\\`
                                                <li class="text-xs flex justify-between font-medium">
                                                    <span class="text-slate-700">\\\${item.name} <b class="text-orange-600 font-black">×\\\${item.quantity}</b></span>
                                                    <span class="text-slate-500">Rs. \\\${(item.price * item.quantity).toFixed(2)}</span>
                                                </li>
                                            \\\`).join('')}
                                        </ul>
                                    </div>
                                    <div class="flex justify-between items-center border-t border-slate-100 pt-3">
                                        <div>
                                            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Total Amount</span>
                                            <span class="text-base font-black text-slate-800">Rs. \${order.totalAmount.toFixed(2)}</span>
                                        </div>
                                        <div class="flex gap-2">
                                            \${order.paymentStatus === 'PENDING' ? \\\`
                                                <button class="reject-order-btn bg-red-100 text-red-700 text-xs font-bold px-3 py-2 rounded transition hover:bg-red-200" data-id="\\\${order.id}">
                                                    Reject
                                                </button>
                                                <button class="approve-payment-btn bg-amber-600 hover:bg-amber-700 text-white text-xs font-black px-4 py-2 rounded uppercase tracking-wider transition shadow-sm" data-id="\\\${order.id}">
                                                    Approve Payment & Token
                                                </button>
                                            \\\` : \\\`
                                                <button class="deliver-order-btn bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black px-4 py-2 rounded uppercase tracking-wider transition shadow-sm" data-id="\\\${order.id}">
                                                    Handover Items
                                                </button>
                                            \\\`}
                                        </div>
                                    </div>
                                </div>
                            \`).join('')}
                        </div>

                        <div class="space-y-4">
                            <h3 class="text-lg font-black tracking-tight uppercase text-slate-800">Inventory Creator</h3>
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
                                <form id="product-creation-form" class="space-y-3">
                                    <div>
                                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Item Title</label>
                                        <input type="text" id="prod-name" required class="w-full p-2 border border-slate-300 rounded text-sm outline-none" placeholder="e.g., Kaju Katli">
                                    </div>
                                    <div class="grid grid-cols-2 gap-2">
                                        <div>
                                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Price (INR)</label>
                                            <input type="number" step="0.01" id="prod-price" required class="w-full p-2 border border-slate-300 rounded text-sm outline-none" placeholder="0.00">
                                        </div>
                                        <div>
                                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Category</label>
                                            <select id="prod-category" class="w-full p-2 border border-slate-300 rounded text-sm bg-white outline-none">
                                                <option value="Sweets">Sweets</option>
                                                <option value="Packaged">Packaged Goods</option>
                                                <option value="Hot Food">Hot Food</option>

                                        <div class="flex gap-2">
                                            <input type="text" id="prod-barcode" value="" class="w-full p-2 border border-slate-300 rounded text-sm outline-none font-mono" placeholder="Scanned item text string">

                                                \${state.scanning ? 'Stop' : 'Scan Cam'}
                                            </button>
                                        </div>
                                    </div>
                                    <div id="scanner-viewport-target" class="\${state.scanning ? 'block' : 'hidden'} w-full bg-slate-50 rounded border p-1 overflow-hidden"></div>
                                    <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-black py-2.5 rounded text-xs uppercase tracking-widest transition shadow-sm">

                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="text-center pt-8">
                        <button id="admin-logout-btn" class="text-xs text-slate-400 underline font-semibold hover:text-slate-600">Disconnect Admin Device Session</button>

                </div>
            `;
        }

        // --- RAZORPAY STYLED CUSTOM QR OVERLAY MODAL ---
        function syncLiveOverlay() {
            const container = document.getElementById("modal-target-overlay");
            if (!container || !state.activeOrderId) return;

            onSnapshot(doc(db, "orders", state.activeOrderId), (snapshot) => {
                if (!snapshot.exists()) {
                    container.innerHTML = "";
                    state.activeOrderId = null;
                    state.showCustomRazorpayPopup = false;
                    return;
                }
                const orderData = snapshot.data();
                
                let modalHtml = "";
                if (orderData.paymentStatus === "PENDING") {
                    if (state.showCustomRazorpayPopup) {
                        modalHtml = `
                            <div class="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 font-sans">
                                <div class="bg-[#1a2138] text-white rounded-lg shadow-2xl w-full max-w-[360px] overflow-hidden border border-slate-800">
                                    <div class="bg-[#232c4c] p-4 flex items-center justify-between border-b border-slate-800">
                                        <div class="flex items-center gap-2">
                                            <div class="w-7 h-7 bg-orange-600 rounded-md flex items-center justify-center font-black text-xs text-white">NS</div>
                                            <div>
                                                <h4 class="font-bold text-sm tracking-wide">Namdev Sweets</h4>
                                                <p class="text-[10px] text-slate-400">Automated QR Self Order</p>
                                            </div>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-[10px] text-slate-400 uppercase tracking-widest font-mono">Amount</p>
                                            <p class="text-sm font-black text-emerald-400">₹\${orderData.totalAmount.toFixed(2)}</p>
                                        </div>
                                    </div>
                                    <div class="p-5 bg-[#1a2138] space-y-4 text-center">
                                        <div class="bg-blue-900/30 border border-blue-500/40 text-blue-300 py-1.5 px-3 rounded text-[11px] font-semibold tracking-wide uppercase inline-block">
                                            ⚡ Powered Securely by UPI Direct
                                        </div>
                                        <div class="bg-white p-2 rounded-lg inline-block mx-auto border-4 border-[#33426b] shadow-2xl">
                                            <img src="\${CUSTOMER_PAYMENT_QR_URL}" alt="Payment QR Gateway" class="w-48 h-48 object-contain rounded">
                                        </div>
                                        <p class="text-xs text-slate-300 px-2 leading-relaxed">
                                            Scan via <b class="text-white">PhonePe, GPay, Paytm</b> & process exactly <span class="text-orange-500 font-bold">₹\${orderData.totalAmount.toFixed(2)}</span>
                                        </p>
                                    </div>
                                    <div class="bg-[#232c4c] p-4 flex flex-col gap-2 border-t border-slate-800">
                                        <button id="custom-rzp-success-trigger-btn" class="w-full bg-[#33933c] hover:bg-green-700 text-white font-bold text-xs uppercase py-3 rounded tracking-wider transition shadow-md">
                                            I Have Paid Successfully
                                        </button>
                                        <button id="custom-rzp-cancel-trigger-btn" class="w-full bg-transparent hover:bg-white/5 text-slate-400 font-medium text-xs py-1.5 transition">
                                            Cancel Transaction
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    } else {
                        modalHtml = `
                            <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                                <div class="bg-white rounded-2xl p-6 w-full max-w-sm text-center shadow-2xl space-y-4">
                                    <div class="w-12 h-12 border-4 border-orange-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
                                    <h3 class="font-bold text-slate-800 text-base">Opening Razorpay Checkout Windows...</h3>
                                    <p class="text-xs text-slate-400 px-2">Establishing direct routing point down to the merchant payment gateway frameset.</p>
                                </div>
                            </div>
                        `;
                        setTimeout(() => {
                            state.showCustomRazorpayPopup = true;
                            render();
                        }, 800);
                    }
                } else if (orderData.paymentStatus === "SUCCESS") {
                    modalHtml = `
                        <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div class="bg-white rounded-2xl p-6 w-full max-w-sm text-center shadow-2xl space-y-4">
                                <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl font-black">✓</div>
                                <div>
                                    <p class="text-xs font-bold uppercase tracking-widest text-emerald-600">Payment Verified</p>
                                    <h3 class="text-slate-900 font-bold text-xl mt-0.5">Namdev Sweets Counter</h3>
                                </div>
                                <div class="bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl py-4 my-2">
                                    <span class="block text-xs font-bold text-slate-400 uppercase tracking-widest">Your Turn Queue</span>
                                    <span class="text-4xl font-black text-slate-800 tracking-tight block mt-1">TOKEN #\${orderData.tokenNumber || '...'}</span>
                                </div>
                                <p class="text-xs text-slate-500 px-2 font-medium">Please show this token number at the counter to collect your fresh sweets!</p>
                                <div class="pt-2">
                                    <button id="close-modal-clear-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs uppercase py-3 rounded-xl transition tracking-wide shadow-md">Done / Clear Screen</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
                
                container.innerHTML = modalHtml;
                const confirmPaidBtn = document.getElementById("custom-rzp-success-trigger-btn");
                if (confirmPaidBtn) {
                    confirmPaidBtn.onclick = () => {
                        state.showCustomRazorpayPopup = false;
                        container.innerHTML = `
                            <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                                <div class="bg-white rounded-2xl p-6 w-full max-w-sm text-center shadow-2xl space-y-4">
                                    <div class="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                                    <h3 class="font-bold text-slate-800 text-base">Verifying UPI Status Reference...</h3>
                                    <p class="text-xs text-amber-600 font-semibold bg-amber-50 py-1.5 px-2 rounded">⏳ Awaiting Counter Staff Approval</p>
                                    <p class="text-[11px] text-slate-400 px-2">Payment verify hote hi aapka token automatic screen par pop-up ho jayega.</p>
                                </div>
                            </div>
                        `;
                    };
                }

                const rzpCancelBtn = document.getElementById("custom-rzp-cancel-trigger-btn");
                if (rzpCancelBtn) {
                    rzpCancelBtn.onclick = async () => {
                        if (confirm("Cancel this payment process?")) {
                            await deleteDoc(doc(db, "orders", state.activeOrderId));
                            state.activeOrderId = null;
                            state.showCustomRazorpayPopup = false;
                            render();
                        }
                    };
                }

                const clearBtn = document.getElementById("close-modal-clear-btn");
                if (clearBtn) {
                    clearBtn.onclick = () => {
                        state.cart = {};
                        state.activeOrderId = null;
                        state.showCustomRazorpayPopup = false;
                        render();
                    };
                }
            });
        }

        // --- APPLICATION CORE BUSINESS MATH LOGIC ---
        function calculateCartTotal() {
            return Object.entries(state.cart).reduce((sum, [id, qty]) => {
                const product = state.products.find(p => p.id === id);
                return sum + (product ? product.price * qty : 0);
            }, 0);
        }

        async function createOrderAndShowQR() {
            if (!state.customerName.trim() || !state.customerPhone.trim()) {
                alert("Please provide your Name and Phone Number first.");
                return;
            }
            const totalSum = calculateCartTotal();
            if (totalSum <= 0) return;

            const compiledItems = Object.entries(state.cart).map(([id, qty]) => {
                const item = state.products.find(p => p.id === id);
                return { id, name: item.name, price: item.price, quantity: qty };
            });

            try {
                const orderRef = await addDoc(collection(db, "orders"), {
                    customerName: state.customerName.trim(),
                    customerPhone: state.customerPhone.trim(),
                    items: compiledItems,
                    totalAmount: totalSum,
                    paymentStatus: "PENDING",
                    deliveryStatus: "PENDING",
                    createdAt: new Date().toISOString()
                });
                state.activeOrderId = orderRef.id;
                state.showCustomRazorpayPopup = false; 
                render(); 
            } catch (err) {
                alert("Order Error: " + err.message);
            }
        }

        // --- GENERAL ROUTED EVENT LISTENERS SYSTEM ---
        function bindEvents() {
            const viewBtn = document.getElementById("toggle-view-btn");
            if (viewBtn) {
                viewBtn.onclick = () => {
                    state.isAdminView = !state.isAdminView;
                    state.scanning = false;
                    if (html5QrcodeScanner) html5QrcodeScanner.clear().catch(e => console.log(e));
                    render();
                };
            }
            
            const brandLink = document.getElementById("nav-brand");
            if (brandLink) {
                brandLink.onclick = () => { state.isAdminView = false; render(); };
            }

            const nameInp = document.getElementById("cust-name");
            const phoneInp = document.getElementById("cust-phone");
            if (nameInp) nameInp.oninput = (e) => state.customerName = e.target.value;
            if (phoneInp) phoneInp.oninput = (e) => state.customerPhone = e.target.value;

            document.querySelectorAll(".category-tab-btn").forEach(btn => {
                btn.onclick = () => { state.activeCategory = btn.getAttribute("data-category"); render(); };
            });

            document.querySelectorAll(".add-to-cart-btn").forEach(btn => {
                btn.onclick = () => { const id = btn.getAttribute("data-id"); state.cart[id] = 1; render(); };
            });

            document.querySelectorAll(".cart-qty-btn").forEach(btn => {
                btn.onclick = () => {
                    const id = btn.getAttribute("data-id");
                    const delta = parseInt(btn.getAttribute("data-delta"));
                    const nextQty = (state.cart[id] || 0) + delta;
                    if (nextQty <= 0) delete state.cart[id];
                    else state.cart[id] = nextQty;
                    render();
                };
            });

            const payBtn = document.getElementById("pay-token-btn");
            if (payBtn) payBtn.onclick = () => createOrderAndShowQR();

            const loginForm = document.getElementById("admin-login-form");
            if (loginForm) {
                loginForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const email = document.getElementById("login-email").value;
                    const pass = document.getElementById("login-pass").value;
                    const errFrame = document.getElementById("auth-err-frame");
                    try {
                        await signInWithEmailAndPassword(auth, email, pass);
                    } catch (err) {
                        errFrame.classList.remove("hidden");
                        errFrame.innerText = "Invalid System Credentials Access Token Rejected.";
                    }
                };
            }

            const logoutBtn = document.getElementById("admin-logout-btn");
            if (logoutBtn) logoutBtn.onclick = () => signOut(auth);

            const audioAlertBtn = document.getElementById("toggle-audio-alert-btn");
            if (audioAlertBtn) {
                audioAlertBtn.onclick = () => {
                    state.audioEnabled = !state.audioEnabled;
                    if (!state.audioEnabled) alarmAudio.pause();
                    else if (state.adminOrders.length > 0) alarmAudio.play().catch(e => console.log(e));
                    render();
                };
            }

            document.querySelectorAll(".approve-payment-btn").forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.getAttribute("data-id");
                    if (confirm("Confirm that you received the UPI payment for this order?")) {
                        const calculatedTokenNum = state.adminOrders.filter(o => o.paymentStatus === 'SUCCESS').length + 1;
                        try {
                            await updateDoc(doc(db, "orders", id), { 
                                paymentStatus: "SUCCESS",
                                tokenNumber: calculatedTokenNum
                            });
                        } catch (e) { alert(e.message); }
                    }
                };
            });

            document.querySelectorAll(".reject-order-btn").forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.getAttribute("data-id");
                    if (confirm("Reject and delete this request?")) {
                        try { await deleteDoc(doc(db, "orders", id)); } catch(e) { alert(e.message); }
                    }
                };
            });

            document.querySelectorAll(".deliver-order-btn").forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.getAttribute("data-id");
                    try { await updateDoc(doc(db, "orders", id), { deliveryStatus: "DELIVERED" }); } catch (e) { alert(e.message); }
                };
            });

            const creationForm = document.getElementById("product-creation-form");
            if (creationForm) {
                creationForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const name = document.getElementById("prod-name").value;
                    const price = parseFloat(document.getElementById("prod-price").value);
                    const category = document.getElementById("prod-category").value;
                    const barcode = document.getElementById("prod-barcode").value;
                    const statusMsg = document.getElementById("product-status-msg");

                    try {
                        const targetId = barcode.trim() ? barcode.trim() : doc(collection(db, "products")).id;
                        await setDoc(doc(db, "products", targetId), {
                            name: name.trim(),
                            price: price,
                            category: category,
                            barcode: barcode.trim() || null,
                            inStock: true,
                            createdAt: new Date().toISOString()
                        });
                        state.scanning = false;
                        if (html5QrcodeScanner) html5QrcodeScanner.clear().catch(e => console.log(e));
                        alert("Item added to menu successfully!");
                        render();
                    } catch (err) { statusMsg.innerText = "Error: " + err.message; }
                };
            }

            const scanBtn = document.getElementById("trigger-scan-btn");
            if (scanBtn) {
                scanBtn.onclick = () => {
                    if (state.scanning) {
                        state.scanning = false;
                        if (html5QrcodeScanner) html5QrcodeScanner.clear().catch(e => console.error(e));
                        render();
                    } else {
                        state.scanning = true;
                        render();
                        setTimeout(() => {
                            html5QrcodeScanner = new Html5QrcodeScanner("scanner-viewport-target", {
                                fps: 15, qrbox: { width: 260, height: 160 }
                            }, false);
                            html5QrcodeScanner.render((decodedText) => {
                                document.getElementById("prod-barcode").value = decodedText;
                                state.scanning = false;
                                html5QrcodeScanner.clear().catch(e => console.error(e));
                                render();
                            }, (err) => {});
                        }, 150);
                    }
                };
            }
        }

        // --- REAL-TIME FIRESTORE DATA CONNECTIONS ---
        const activeCatalogQuery = query(collection(db, "products"), where("inStock", "==", true));
        onSnapshot(activeCatalogQuery, (snapshot) => {
            state.products = [];
            snapshot.forEach((doc) => { state.products.push({ id: doc.id, ...doc.data() }); });
            if (!state.isAdminView) render();
        });

        const liveOrdersQuery = query(collection(db, "orders"), where("deliveryStatus", "==", "PENDING"), orderBy("createdAt", "desc"));
        onSnapshot(liveOrdersQuery, (snapshot) => {
            state.adminOrders = [];
            snapshot.forEach((doc) => { state.adminOrders.push({ id: doc.id, ...doc.data() }); });
            if (state.adminOrders.length > 0 && state.audioEnabled && state.isAdminView) {
                alarmAudio.play().catch(e => console.log(e));
            } else { alarmAudio.pause(); }
            if (state.isAdminView) render();
        });

        onAuthStateChanged(auth, (currentUser) => { state.user = currentUser; render(); });

        render();
    </script>
</body>
</html>
