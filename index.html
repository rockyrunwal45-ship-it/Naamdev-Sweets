<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBS - Cash Deposit Module (Demo)</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #f0f4f8;
            margin: 20px;
            color: #333;
        }
        .system-container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            border: 2px solid #0056b3;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.1);
        }
        .system-header {
            background-color: #0056b3;
            color: white;
            padding: 10px;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
        }
        .form-section {
            padding: 20px;
        }
        .row {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        .row label {
            width: 200px;
            font-weight: bold;
        }
        .row input {
            padding: 6px;
            width: 250px;
            border: 1px solid #999;
            background-color: #fffffe;
        }
        .row input:focus {
            background-color: #ffffcc; /* क्लिक करने पर बैंक सॉफ्टवेयर की तरह पीला बैकग्राउंड */
            outline: none;
        }
        .denomination-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .denomination-table th, .denomination-table td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        .denomination-table th {
            background-color: #e6f2ff;
        }
        .denom-input {
            width: 80px;
            text-align: center;
            padding: 4px;
        }
        .total-section {
            margin-top: 20px;
            text-align: right;
            font-size: 18px;
            font-weight: bold;
            background: #e6e6e6;
            padding: 10px;
            border-top: 2px solid #0056b3;
        }
        .btn-container {
            padding: 15px;
            text-align: center;
            background-color: #f9f9f9;
        }
        .btn {
            background-color: #008040;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }
        .btn:hover {
            background-color: #006633;
        }
        #success-toast {
            display: none;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            padding: 15px;
            margin: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="system-container">
    <div class="system-header">
        <span>CORE BANKING SYSTEM (V2026.2)</span>
        <span>TXN CODE: 1001 (CASH DEP)</span>
    </div>

    <div class="form-section">
        <!-- अकाउंट नंबर -->
        <div class="row">
            <label>Account Number:</label>
            <input type="text" id="accNum" value="30456123987">
        </div>
        
        <!-- नाम बदलने का ऑप्शन (अब यह ओपन है, तुम अपना नाम लिख सकते हो) -->
        <div class="row">
            <label>Account Holder Name:</label>
            <input type="text" id="accName" placeholder="यहाँ अपना नाम टाइप करें...">
        </div>
        
        <div class="row">
            <label>Current Balance:</label>
            <input type="text" id="currBal" value="₹ 0.00" readonly style="background:#e9ecef; color: blue; font-weight: bold;">
        </div>
        <div class="row">
            <label>Transaction Remarks:</label>
            <input type="text" value="BY CASH DEPOSIT">
        </div>

        <hr style="border: 0; border-top: 1px dashed #ccc; margin: 20px 0;">
        <h4 style="margin: 0;">DENOMINATION DETAILS (नोटों का विवरण)</h4>

        <table class="denomination-table">
            <thead>
                <tr>
                    <th>Note Type (₹)</th>
                    <th>Count (नोटों की संख्या)</th>
                    <th>Value (कुल रुपये)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><b>500</b></td>
                    <td><input type="number" class="denom-input" id="n500" value="0" min="0" oninput="calculateTotal()"></td>
                    <td>₹ <span id="v500">0</span></td>
                </tr>
                <tr>
                    <td><b>200</b></td>
                    <td><input type="number" class="denom-input" id="n200" value="0" min="0" oninput="calculateTotal()"></td>
                    <td>₹ <span id="v200">0</span></td>
                </tr>
                <tr>
                    <td><b>100</b></td>
                    <td><input type="number" class="denom-input" id="n100" value="0" min="0" oninput="calculateTotal()"></td>
                    <td>₹ <span id="v100">0</span></td>
                </tr>
                <tr>
                    <td><b>50</b></td>
                    <td><input type="number" class="denom-input" id="n50" value="0" min="0" oninput="calculateTotal()"></td>
                    <td>₹ <span id="v50">0</span></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="total-section">
        TOTAL CASH AMOUNT: ₹ <span id="totalTxnAmount">0</span>.00
    </div>

    <div id="success-toast">
        ✔ TRANSACTION SUCCESSFUL!<br>
        <span id="toastDetails"></span>
    </div>

    <div class="btn-container">
        <button class="btn" onclick="submitTransaction()">[F10] SUBMIT TRANSACTION</button>
    </div>
</div>

<script>
    // लाइव नोट कैलकुलेशन
    function calculateTotal() {
        const n500 = parseInt(document.getElementById('n500').value) || 0;
        const n200 = parseInt(document.getElementById('n200').value) || 0;
        const n100 = parseInt(document.getElementById('n100').value) || 0;
        const n50 = parseInt(document.getElementById('n50').value) || 0;

        const v500 = n500 * 500;
        const v200 = n200 * 200;
        const v100 = n100 * 100;
        const v50 = n50 * 50;

        document.getElementById('v500').innerText = v500;
        document.getElementById('v200').innerText = v200;
        document.getElementById('v100').innerText = v100;
        document.getElementById('v50').innerText = v50;

        const total = v500 + v200 + v100 + v50;
        document.getElementById('totalTxnAmount').innerText = total;
        
        return total;
    }

    // सबमिट करने पर एक्शन
    function submitTransaction() {
        const totalAmount = calculateTotal();
        let name = document.getElementById('accName').value.trim();
        
        // अगर नाम खाली है तो अलर्ट आएगा
        if (name === "") {
            alert("कृपया Account Holder Name दर्ज करें!");
            return;
        }

        if (totalAmount <= 0) {
            alert("कृपया कम से कम एक नोट की संख्या दर्ज करें!");
            return;
        }

        // नाम को कैपिटल लेटर में दिखाने के लिए
        name = name.toUpperCase();

        const toast = document.getElementById('success-toast');
        const toastDetails = document.getElementById('toastDetails');
        
        // सक्सेस मैसेज में डायनामिक नाम दिखेगा
        toastDetails.innerHTML = `Amount ₹${totalAmount.toLocaleString('en-IN')}.00 Credited to ${name}'s Account.<br>SMS Notification Sent to Registered Mobile.`;
        toast.style.display = 'block';

        // करंट बैलेंस को अपडेट करना
        document.getElementById('currBal').value = "₹ " + totalAmount.toLocaleString('en-IN') + ".00";

        toast.scrollIntoView({ behavior: 'smooth' });
    </div>
</script>

</body>
    </html>
